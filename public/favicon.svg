<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark rounded-square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="#0A0A0A"/>

  <!-- Subtle inner vignette glow -->
  <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
  </radialGradient>
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg-glow)"/>

  <!-- Isometric cube — centered at (32, 32), radius ~26px -->
  <!-- Computed points:
       cx=32, cy=32, r=26, ri=22.88
       Top face:    (32, 7.28)  (51.79, 21.93)  (32, 32)  (12.21, 21.93)
       Left face:   (12.21, 21.93)  (32, 32)  (32, 56.72)  (12.21, 42.07)
       Right face:  (51.79, 21.93)  (32, 32)  (32, 56.72)  (51.79, 42.07)
  -->
  <defs>
    <filter id="n-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Top face (warm amber) -->
  <polygon
    points="32,7.28 51.79,21.93 32,32 12.21,21.93"
    fill="#F59E0B"
    fill-opacity="0.97"
  />

  <!-- Left face (mid amber) -->
  <polygon
    points="12.21,21.93 32,32 32,56.72 12.21,42.07"
    fill="#D97706"
    fill-opacity="0.93"
  />

  <!-- Right face (deep amber) -->
  <polygon
    points="51.79,21.93 32,32 32,56.72 51.79,42.07"
    fill="#B45309"
    fill-opacity="0.88"
  />

  <!-- Edge outlines -->
  <polygon points="32,7.28 51.79,21.93 32,32 12.21,21.93"
           fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="0.9"/>
  <polygon points="12.21,21.93 32,32 32,56.72 12.21,42.07"
           fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.9"/>
  <polygon points="51.79,21.93 32,32 32,56.72 51.79,42.07"
           fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="0.9"/>

  <!-- Center vertical spine -->
  <line x1="32" y1="7.8" x2="32" y2="56.2"
        stroke="rgba(255,255,255,0.28)" stroke-width="0.7"/>

  <!-- Architectural "N" mark (white strokes, projected on cube faces)
       Left vert:  from (~19.4, 38.8) to (~19.4, 50.8)
       Right vert: from (~44.6, 24.6) to (~44.6, 43.4)
       Diagonal:   connects top of left to top of right
       (scaled: ri*0.55=12.58 offset from cx/cy)
  -->
  <path
    d="M 19.4,38.8 L 19.4,50.8
       M 44.6,24.6 L 44.6,43.4
       M 19.4,38.8 L 44.6,43.4"
    stroke="rgba(255,255,255,0.95)"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#n-glow)"
  />
</svg>